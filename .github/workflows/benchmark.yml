name: Run GH-3988 benchmark

on:
  workflow_dispatch:
    inputs:
      class:
        description: 'Benchmark class glob'
        required: true
        default: '*ParquetLargeBinaryVariableSizeReadBenchmark'
      jdk:
        type: choice
        description: 'JDK version: 21 or 25'
        required: true
        default: '21'
        options:
        - '21'
        - '25'
      scala:
        type: choice
        description: 'Scala version: 2.13'
        required: true
        default: '2.13'
        options:
          - '2.13'
      failfast:
        type: boolean
        description: 'Failfast'
        required: true
        default: true
      num-splits:
        description: 'Number of job splits'
        required: true
        default: '1'
      create-commit:
        type: boolean
        description: 'Commit the benchmark results to the current branch'
        required: true
        default: false
      expected-cpu:
        type: string
        description: 'Expected CPU model (e.g. "AMD EPYC 7763"). If set, the job fails early when the runner CPU does not match.'
        required: false
        default: ''

jobs:
  matrix-gen:
    name: Generate matrix for job splits
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      SPARK_BENCHMARK_NUM_SPLITS: ${{ inputs.num-splits }}
    steps:
    - name: Generate matrix
      id: set-matrix
      run: echo "matrix=["`seq -s, 1 $SPARK_BENCHMARK_NUM_SPLITS`"]" >> $GITHUB_OUTPUT

  benchmark:
    name: "Run benchmarks: ${{ inputs.class }} (JDK ${{ inputs.jdk }}, Scala ${{ inputs.scala }}, ${{ matrix.split }} out of ${{ inputs.num-splits }} splits)"
    if: always()
    needs: [matrix-gen]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        split: ${{fromJSON(needs.matrix-gen.outputs.matrix)}}
    env:
      SPARK_BENCHMARK_FAILFAST: ${{ inputs.failfast }}
      SPARK_BENCHMARK_NUM_SPLITS: ${{ inputs.num-splits }}
      SPARK_BENCHMARK_CUR_SPLIT: ${{ matrix.split }}
      SPARK_GENERATE_BENCHMARK_FILES: 1
      SPARK_LOCAL_IP: localhost
      # To prevent spark.test.home not being set. See more detail in SPARK-36007.
      SPARK_HOME: ${{ github.workspace }}
    steps:
    - name: Checkout Spark repository
      uses: actions/checkout@v7
      # In order to get diff files
      with:
        fetch-depth: 0
    - name: Check CPU model
      env:
        EXPECTED_CPU: ${{ inputs.expected-cpu }}
      run: |
        CPU_MODEL=$(grep "model name" /proc/cpuinfo | head -1 | sed 's/model name\s*:\s*//')
        echo "Runner CPU: $CPU_MODEL"
        echo "::notice::Runner CPU: $CPU_MODEL"
        if [ -n "$EXPECTED_CPU" ]; then
          if echo "$CPU_MODEL" | grep -qF "$EXPECTED_CPU"; then
            echo "CPU matches expected: $EXPECTED_CPU"
          else
            echo "::error::CPU mismatch! Expected '$EXPECTED_CPU' but got '$CPU_MODEL'"
            exit 1
          fi
        fi
    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        java-version: ${{ inputs.jdk }}
        coursier: cache
    # Two parquet-java commits from apache/parquet-java#3990 ("GH-3988: Expose per-column-chunk
    # uncompressed size via PageReader"): d6fb2c8cd is the PR's base commit (no
    # getTotalUncompressedSize() at all), c86b7bef1 is the PR's head commit (API exposed). The
    # API alone has zero effect -- the consumer patch applied below to VectorizedColumnReader.java
    # is what actually uses it to pre-size OnHeapColumnVector.
    - name: Checkout parquet-java baseline (before GH-3988 / PR #3990)
      uses: actions/checkout@v7
      with:
        repository: wangyum/parquet-java
        ref: d6fb2c8cd8dda3684c350b4016cc85905d31a8d5
        path: parquet-baseline
    - name: Checkout parquet-java feature (GH-3988 / PR #3990 head)
      uses: actions/checkout@v7
      with:
        repository: wangyum/parquet-java
        ref: c86b7bef1e67b9b41276b95128c6ad41462fa1e3
        path: parquet-feature
    - name: Build Thrift (required by parquet-format-structures)
      working-directory: parquet-feature
      run: ./dev/ci-before_install.sh
    - name: Build both parquet-java snapshots into the shared local repo
      run: |
        set -euo pipefail
        build_parquet() {
          local dir="$1"
          local version="$2"
          local repo="$3"
          find "$dir" -name pom.xml -print0 \
            | xargs -0 sed -i "s|<version>1.19.0-SNAPSHOT</version>|<version>${version}</version>|g"
          (
            cd "$dir"
            ./mvnw -q -B -Dmaven.repo.local="$repo" \
              -pl parquet-avro,parquet-column,parquet-hadoop -am \
              install -DskipTests -Dspotless.check.skip=true -Djapicmp.skip=true
          )
          mkdir -p ~/.m2/repository/org/apache/parquet
          cp -r "${repo}/org/apache/parquet/." ~/.m2/repository/org/apache/parquet/
        }
        build_parquet parquet-baseline 1.19.0-nogh3988-SNAPSHOT "${{ github.workspace }}/.m2-parquet-baseline"
        build_parquet parquet-feature 1.19.0-gh3988-SNAPSHOT "${{ github.workspace }}/.m2-parquet-feature"
        rm -rf parquet-baseline parquet-feature \
          "${{ github.workspace }}/.m2-parquet-baseline" \
          "${{ github.workspace }}/.m2-parquet-feature"
    - name: Run baseline and GH-3988 benchmarks on this runner
      run: |
        set -euo pipefail
        # Make less noisy
        cp conf/log4j2.properties.template conf/log4j2.properties
        sed -i 's/rootLogger.level = info/rootLogger.level = warn/g' conf/log4j2.properties
        RESULT_DIR=/tmp/ab-results
        mkdir -p "$RESULT_DIR"
        run_one() {
          local version="$1"
          local label="$2"
          echo "========== ${label} (parquet.version=${version}) =========="
          sed -i "s|<parquet.version>.*</parquet.version>|<parquet.version>${version}</parquet.version>|" pom.xml
          ./build/sbt -Pscala-${{ inputs.scala }} -Pyarn -Pkubernetes -Phive -Phive-thriftserver -Phadoop-cloud -Pkinesis-asl -Pcredential-aws -Pspark-ganglia-lgpl Test/package
          # In benchmark, we use local as master so set driver memory only. Note that GitHub Actions has 7 GB memory limit.
          bin/spark-submit \
            --driver-memory 6g \
            --conf spark.driver.extraJavaOptions=-XX:MaxDirectMemorySize=8g \
            --class org.apache.spark.benchmark.Benchmarks \
            --jars "`find . -name '*-SNAPSHOT-tests.jar' -o -name '*avro*-SNAPSHOT.jar' -o -name 'spark-*kafka-0-10*-SNAPSHOT.jar' | paste -sd ',' -`,`find ~/.cache/coursier -name 'curator-test-*.jar'`,`find ~/.cache/coursier \( -name 'kafka*.jar' -o -name 'metrics-core-2.2.0.jar' -o -name 'jopt-simple-*.jar' -o -name 'scala-java8-compat_*.jar' -o -name 'scala-logging_*.jar' -o -name 'jackson-dataformat-csv-*.jar' -o -name 'commons-pool2-*.jar' \) ! -name '*-sources.jar' ! -name '*-javadoc.jar' | paste -sd ',' -`" \
            "`find . -name 'spark-core*-SNAPSHOT-tests.jar'`" \
            "${{ inputs.class }}"
          mapfile -t result_files < <(find . -path ./target -prune -o -name 'ParquetLargeBinaryVariableSizeReadBenchmark-results.txt' -print)
          if [ "${#result_files[@]}" -eq 0 ]; then
            echo "No ParquetLargeBinaryVariableSizeReadBenchmark-results.txt produced for ${label}"
            exit 1
          fi
          cp "${result_files[0]}" "${RESULT_DIR}/${label}-ParquetLargeBinaryVariableSizeReadBenchmark-results.txt"
        }
        run_one 1.19.0-nogh3988-SNAPSHOT baseline
        # GH-3988's actual effect requires a Spark-source-level consumer patch, not just a
        # parquet.version flip: VectorizedColumnReader.readBatch() needs to call the newly
        # exposed PageReader.getTotalUncompressedSize()/getTotalValueCount() to pre-size
        # OnHeapColumnVector's backing array. Swap in the patched source for the feature pass.
        cp dev/gh3988/VectorizedColumnReader.java.patched \
          sql/core/src/main/java/org/apache/spark/sql/execution/datasources/parquet/VectorizedColumnReader.java
        run_one 1.19.0-gh3988-SNAPSHOT feature
        echo "========== COMPARISON (same runner, same Spark tree, parquet.version flipped + consumer patch) =========="
        echo "----- baseline: before GH-3988, parquet 1.19.0-nogh3988-SNAPSHOT, stock VectorizedColumnReader -----"
        cat "${RESULT_DIR}/baseline-ParquetLargeBinaryVariableSizeReadBenchmark-results.txt"
        echo "----- feature: GH-3988 (apache/parquet-java#3990) + consumer patch, parquet 1.19.0-gh3988-SNAPSHOT -----"
        cat "${RESULT_DIR}/feature-ParquetLargeBinaryVariableSizeReadBenchmark-results.txt"
        echo "Preparing the benchmark results:"
        tar -C "$RESULT_DIR" -cvf target/benchmark-results-${{ inputs.jdk }}-${{ inputs.scala }}.tar .
    - name: Create a pull request with the results
      if: ${{ inputs.create-commit && success() }}
      run: |
        git config --local user.name "${{ github.actor }}"
        git config --local user.email "${{ github.event.pusher.email || format('{0}@users.noreply.github.com', github.actor) }}"
        git add -A
        git commit -m "Benchmark results for ${{ inputs.class }} (JDK ${{ inputs.jdk }}, Scala ${{ inputs.scala }}, split ${{ matrix.split }} of ${{ inputs.num-splits }})"
        for i in {1..5}; do
          echo "Attempt $i to push..."
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }}
          if git push origin ${{ github.ref_name }}:${{ github.ref_name }}; then
            echo "Push successful."
            exit 0
          else
            echo "Push failed, retrying in 3 seconds..."
            sleep 3
          fi
        done
        echo "Error: Failed to push after 5 attempts."
        exit 1
    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ inputs.jdk }}-${{ inputs.scala }}-${{ matrix.split }}
        path: target/benchmark-results-${{ inputs.jdk }}-${{ inputs.scala }}.tar
