name: Run benchmarks

on:
  workflow_dispatch:
    inputs:
      class:
        description: 'Benchmark class glob'
        required: true
        default: '*ParquetLargeBinaryDecompressBenchmark'
      jdk:
        type: choice
        description: 'JDK version: 21 or 25'
        required: true
        default: '21'
        options:
        - '21'
        - '25'
      scala:
        type: choice
        description: 'Scala version: 2.13'
        required: true
        default: '2.13'
        options:
          - '2.13'
      failfast:
        type: boolean
        description: 'Failfast'
        required: true
        default: true
      num-splits:
        description: 'Number of job splits'
        required: true
        default: '1'
      create-commit:
        type: boolean
        description: 'Commit the benchmark results to the current branch'
        required: true
        default: false
      generate-tpcds:
        type: boolean
        description: 'Generate TPC-DS data (required for TPC-DS benchmarks and all-benchmark runs)'
        required: true
        default: false
      expected-cpu:
        type: string
        description: 'Expected CPU model (e.g. "AMD EPYC 7763"). If set, the job fails early when the runner CPU does not match.'
        required: false
        default: ''

jobs:
  matrix-gen:
    name: Generate matrix for job splits
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      SPARK_BENCHMARK_NUM_SPLITS: ${{ inputs.num-splits }}
    steps:
    - name: Generate matrix
      id: set-matrix
      run: echo "matrix=["`seq -s, 1 $SPARK_BENCHMARK_NUM_SPLITS`"]" >> $GITHUB_OUTPUT

  # Any TPC-DS related updates on this job need to be applied to tpcds-1g job of build_and_test.yml as well
  tpcds-1g-gen:
    name: "Generate an TPC-DS dataset with SF=1"
    if: inputs.generate-tpcds
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: localhost
    steps:
      - name: Checkout Spark repository
        uses: actions/checkout@v7
        # In order to get diff files
        with:
          fetch-depth: 0
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          coursier: cache
      - name: Cache TPC-DS generated data
        id: cache-tpcds-sf-1
        uses: actions/cache@v6
        with:
          path: |
            ./tpcds-sf-1
            ./tpcds-sf-1-text
          key: tpcds-${{ hashFiles('.github/workflows/benchmark.yml', 'sql/core/src/test/scala/org/apache/spark/sql/TPCDSSchema.scala') }}
      - name: Checkout tpcds-kit repository
        if: steps.cache-tpcds-sf-1.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: databricks/tpcds-kit
          ref: 1b7fb7529edae091684201fab142d956d6afd881
          path: ./tpcds-kit
      - name: Build tpcds-kit
        if: steps.cache-tpcds-sf-1.outputs.cache-hit != 'true'
        run: |
          # tpcds-kit is old C code (implicit int, K&R declarations) that newer GCC
          # versions (e.g. GCC 15 on Ubuntu 26.04) reject by default, so pin the C standard.
          cd tpcds-kit/tools && make OS=LINUX LINUX_CFLAGS="-O3 -std=gnu89"
      - name: Install Java ${{ inputs.jdk }}
        if: steps.cache-tpcds-sf-1.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ inputs.jdk }}
      - name: Generate TPC-DS (SF=1) table data
        if: steps.cache-tpcds-sf-1.outputs.cache-hit != 'true'
        run: |
          build/sbt "sql/Test/runMain org.apache.spark.sql.GenTPCDSData --dsdgenDir `pwd`/tpcds-kit/tools --location `pwd`/tpcds-sf-1 --scaleFactor 1 --numPartitions 1 --overwrite"
          mkdir -p `pwd`/tpcds-sf-1-text && rm -f `pwd`/tpcds-sf-1-text/* && `pwd`/tpcds-kit/tools/dsdgen -DISTRIBUTIONS `pwd`/tpcds-kit/tools/tpcds.idx -SCALE 1 -DIR `pwd`/tpcds-sf-1-text

  benchmark:
    name: "Run benchmarks: ${{ inputs.class }} (JDK ${{ inputs.jdk }}, Scala ${{ inputs.scala }}, ${{ matrix.split }} out of ${{ inputs.num-splits }} splits)"
    if: always()
    needs: [matrix-gen, tpcds-1g-gen]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        split: ${{fromJSON(needs.matrix-gen.outputs.matrix)}}
    env:
      SPARK_BENCHMARK_FAILFAST: ${{ inputs.failfast }}
      SPARK_BENCHMARK_NUM_SPLITS: ${{ inputs.num-splits }}
      SPARK_BENCHMARK_CUR_SPLIT: ${{ matrix.split }}
      SPARK_GENERATE_BENCHMARK_FILES: 1
      SPARK_LOCAL_IP: localhost
      # To prevent spark.test.home not being set. See more detail in SPARK-36007.
      SPARK_HOME: ${{ github.workspace }}
      SPARK_TPCDS_DATA: ${{ github.workspace }}/tpcds-sf-1
      SPARK_TPCDS_DATA_TEXT: ${{ github.workspace }}/tpcds-sf-1-text
    steps:
    - name: Checkout Spark repository
      uses: actions/checkout@v7
      # In order to get diff files
      with:
        fetch-depth: 0
    - name: Check CPU model
      env:
        EXPECTED_CPU: ${{ inputs.expected-cpu }}
      run: |
        CPU_MODEL=$(grep "model name" /proc/cpuinfo | head -1 | sed 's/model name\s*:\s*//')
        echo "Runner CPU: $CPU_MODEL"
        echo "::notice::Runner CPU: $CPU_MODEL"
        if [ -n "$EXPECTED_CPU" ]; then
          if echo "$CPU_MODEL" | grep -qF "$EXPECTED_CPU"; then
            echo "CPU matches expected: $EXPECTED_CPU"
          else
            echo "::error::CPU mismatch! Expected '$EXPECTED_CPU' but got '$CPU_MODEL'"
            exit 1
          fi
        fi
    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        java-version: ${{ inputs.jdk }}
        coursier: cache
    # Two parquet-java commits, installed under different versions so this runner can build
    # the same Spark tree against each in turn: 4505186f7 is the direct parent of the GH-3996
    # fix (35f28fe6c) on the apache/parquet-java commit graph, so this isolates exactly that
    # one commit's effect with no other confounding changes.
    - name: Checkout parquet-java baseline (before GH-3996 fix)
      uses: actions/checkout@v7
      with:
        repository: wangyum/parquet-java
        ref: 4505186f7045f7ca01f270d2cd0640f1e07e48a7
        path: parquet-baseline
    - name: Checkout parquet-java feature (GH-3996 fix)
      uses: actions/checkout@v7
      with:
        repository: wangyum/parquet-java
        ref: 35f28fe6cdf47379825bf7a1cb87f01a39a3f3b6
        path: parquet-feature
    - name: Build Thrift (required by parquet-format-structures)
      working-directory: parquet-feature
      run: ./dev/ci-before_install.sh
    - name: Build both parquet-java snapshots into the shared local repo
      run: |
        set -euo pipefail
        build_parquet() {
          local dir="$1"
          local version="$2"
          local repo="$3"
          find "$dir" -name pom.xml -print0 \
            | xargs -0 sed -i "s|<version>1.19.0-SNAPSHOT</version>|<version>${version}</version>|g"
          (
            cd "$dir"
            # -pl lists every org.apache.parquet artifact Spark's pom.xml pins to ${parquet.version}
            # (parquet-column, parquet-hadoop, parquet-avro); -am also-makes whatever those need
            # transitively (parquet-common, parquet-encoding, parquet-format-structures,
            # parquet-variant, parquet-jackson, parquet-generator, ...).
            ./mvnw -q -B -Dmaven.repo.local="$repo" \
              -pl parquet-avro,parquet-column,parquet-hadoop -am \
              install -DskipTests -Dspotless.check.skip=true -Djapicmp.skip=true
          )
          mkdir -p ~/.m2/repository/org/apache/parquet
          cp -r "${repo}/org/apache/parquet/." ~/.m2/repository/org/apache/parquet/
        }
        build_parquet parquet-baseline 1.19.0-nogh3996-SNAPSHOT "${{ github.workspace }}/.m2-parquet-baseline"
        build_parquet parquet-feature 1.19.0-gh3996-SNAPSHOT "${{ github.workspace }}/.m2-parquet-feature"
        # Drop the source trees and isolated repos so the later `find .` in spark-submit
        # cannot put both parquet versions on the same classpath.
        rm -rf parquet-baseline parquet-feature \
          "${{ github.workspace }}/.m2-parquet-baseline" \
          "${{ github.workspace }}/.m2-parquet-feature"
    - name: Cache TPC-DS generated data
      if: inputs.generate-tpcds
      id: cache-tpcds-sf-1
      uses: actions/cache@v6
      with:
        path: |
          ./tpcds-sf-1
          ./tpcds-sf-1-text
        key: tpcds-${{ hashFiles('.github/workflows/benchmark.yml', 'sql/core/src/test/scala/org/apache/spark/sql/TPCDSSchema.scala') }}
    - name: Run baseline and GH-3996 benchmarks on this runner
      run: |
        set -euo pipefail
        # Make less noisy
        cp conf/log4j2.properties.template conf/log4j2.properties
        sed -i 's/rootLogger.level = info/rootLogger.level = warn/g' conf/log4j2.properties
        RESULT_DIR=/tmp/ab-results
        mkdir -p "$RESULT_DIR"
        run_one() {
          local version="$1"
          local label="$2"
          echo "========== ${label} (parquet.version=${version}) =========="
          # Same Spark source tree for both passes -- GH-3996 is a parquet-hadoop-only fix, so
          # unlike a Spark-source-level patch we only need to flip the pinned parquet.version
          # and rebuild/relink against the matching jar already installed in ~/.m2 above.
          sed -i "s|<parquet.version>.*</parquet.version>|<parquet.version>${version}</parquet.version>|" pom.xml
          ./build/sbt -Pscala-${{ inputs.scala }} -Pyarn -Pkubernetes -Phive -Phive-thriftserver -Phadoop-cloud -Pkinesis-asl -Pcredential-aws -Pspark-ganglia-lgpl Test/package
          # In benchmark, we use local as master so set driver memory only. Note that GitHub Actions has 7 GB memory limit.
          bin/spark-submit \
            --driver-memory 6g \
            --conf spark.driver.extraJavaOptions=-XX:MaxDirectMemorySize=8g \
            --class org.apache.spark.benchmark.Benchmarks \
            --jars "`find . -name '*-SNAPSHOT-tests.jar' -o -name '*avro*-SNAPSHOT.jar' -o -name 'spark-*kafka-0-10*-SNAPSHOT.jar' | paste -sd ',' -`,`find ~/.cache/coursier -name 'curator-test-*.jar'`,`find ~/.cache/coursier \( -name 'kafka*.jar' -o -name 'metrics-core-2.2.0.jar' -o -name 'jopt-simple-*.jar' -o -name 'scala-java8-compat_*.jar' -o -name 'scala-logging_*.jar' -o -name 'jackson-dataformat-csv-*.jar' -o -name 'commons-pool2-*.jar' \) ! -name '*-sources.jar' ! -name '*-javadoc.jar' | paste -sd ',' -`" \
            "`find . -name 'spark-core*-SNAPSHOT-tests.jar'`" \
            "${{ inputs.class }}"
          mapfile -t result_files < <(find . -path ./target -prune -o -name 'ParquetLargeBinaryDecompressBenchmark-results.txt' -print)
          if [ "${#result_files[@]}" -eq 0 ]; then
            echo "No ParquetLargeBinaryDecompressBenchmark-results.txt produced for ${label}"
            exit 1
          fi
          cp "${result_files[0]}" "${RESULT_DIR}/${label}-ParquetLargeBinaryDecompressBenchmark-results.txt"
        }
        run_one 1.19.0-nogh3996-SNAPSHOT baseline
        run_one 1.19.0-gh3996-SNAPSHOT feature
        echo "========== COMPARISON (same runner, same Spark tree, parquet.version flipped) =========="
        echo "----- baseline: before GH-3996 fix, parquet 1.19.0-nogh3996-SNAPSHOT -----"
        cat "${RESULT_DIR}/baseline-ParquetLargeBinaryDecompressBenchmark-results.txt"
        echo "----- feature: GH-3996 fix (apache/parquet-java#3997), parquet 1.19.0-gh3996-SNAPSHOT -----"
        cat "${RESULT_DIR}/feature-ParquetLargeBinaryDecompressBenchmark-results.txt"
        # To keep the directory structure and file permissions, tar them
        # See also https://github.com/actions/upload-artifact#maintaining-file-permissions-and-case-sensitive-files
        echo "Preparing the benchmark results:"
        tar -C "$RESULT_DIR" -cvf target/benchmark-results-${{ inputs.jdk }}-${{ inputs.scala }}.tar .
    - name: Create a pull request with the results
      if: ${{ inputs.create-commit && success() }}
      run: |
        git config --local user.name "${{ github.actor }}"
        git config --local user.email "${{ github.event.pusher.email || format('{0}@users.noreply.github.com', github.actor) }}"
        git add -A
        git commit -m "Benchmark results for ${{ inputs.class }} (JDK ${{ inputs.jdk }}, Scala ${{ inputs.scala }}, split ${{ matrix.split }} of ${{ inputs.num-splits }})"
        for i in {1..5}; do
          echo "Attempt $i to push..."
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }}
          if git push origin ${{ github.ref_name }}:${{ github.ref_name }}; then
            echo "Push successful."
            exit 0
          else
            echo "Push failed, retrying in 3 seconds..."
            sleep 3
          fi
        done
        echo "Error: Failed to push after 5 attempts."
        exit 1
    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ inputs.jdk }}-${{ inputs.scala }}-${{ matrix.split }}
        path: target/benchmark-results-${{ inputs.jdk }}-${{ inputs.scala }}.tar